services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: affiliate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-affiliate}
      POSTGRES_DB: affiliate
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U affiliate -d affiliate"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://affiliate:${POSTGRES_PASSWORD:-affiliate}@postgres:5432/affiliate?schema=public
      PORT: 3000
      LOG_LEVEL: info
      EXTRACTOR_MODE: ${EXTRACTOR_MODE:-live}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3001}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-10}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-http://localhost:3000}
      ORIGIN: http://localhost:3001
    depends_on:
      - api
    ports:
      - "3001:3001"
    restart: unless-stopped

volumes:
  pgdata:
